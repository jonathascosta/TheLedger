name: iOS

# Builds the iOS app for the simulator, without signing, when a change touches the native side
# or how the app is built: on its pull request and again on main after the merge.
on:
  push:
    branches: [main]
    paths: &paths
      - 'apps/game/ios/**'
      - 'apps/game/capacitor.config.ts'
      - 'apps/game/vite.config.ts'
      - 'apps/game/package.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.nvmrc'
      - '.github/workflows/ios.yml'
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: iOS build (simulator, unsigned)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ios:sync
      - run: xcodebuild -version
      - name: Build the app
        working-directory: apps/game/ios/App
        run: >-
          xcodebuild build
          -project App.xcodeproj
          -scheme App
          -configuration Release
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO
